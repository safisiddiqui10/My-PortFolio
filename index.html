<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safi Siddiqui — MERN Stack Developer and AI Engineer</title>
  <meta name="description"
    content="Safi Siddiqui is a MERN stack developer and AI engineer building scalable web applications, intelligent AI systems and data-driven solutions." />
  <meta name="author" content="Safi Siddiqui" />
  <link rel="canonical" href="%SITE_URL%/" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Link previews (LinkedIn, WhatsApp, Slack, X and others). Crawlers read these without running JavaScript. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Safi Siddiqui" />
  <meta property="og:title" content="Safi Siddiqui — MERN Stack Developer and AI Engineer" />
  <meta property="og:description"
    content="I build full-stack web apps and AI systems. MERN stack developer, AI engineer and aspiring data scientist." />
  <meta property="og:url" content="%SITE_URL%/" />
  <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Safi Siddiqui — I build full-stack web apps and AI systems" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Safi Siddiqui",
      "url": "%SITE_URL%/",
      "image": "%SITE_URL%/Profile/headshot.jpeg",
      "jobTitle": "MERN Stack Developer and AI Engineer",
      "address": { "@type": "PostalAddress", "addressLocality": "Bhopal", "addressRegion": "Madhya Pradesh", "addressCountry": "IN" },
      "sameAs": [
        "https://github.com/safisiddiqui10",
        "https://www.linkedin.com/in/safi-siddiqui-b59aa930a",
        "https://www.kaggle.com/safisiddiqui10",
        "https://huggingface.co/Safii10"
      ]
    }
  </script>

  <!-- Apply the saved (or system) theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-paper text-ink font-sans antialiased min-h-screen">
  <div id="root"></div>

</body>

</html>
